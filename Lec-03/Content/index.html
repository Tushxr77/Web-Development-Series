<!-- Basic Knowledge of HTML -->

<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5 -->

<html lang="en">
<!-- The <html> tag is the root element.
     The complete HTML content of the website is written inside it. -->

<head>
    <!-- The <head> contains information about the webpage,
         such as the title and metadata. -->

    <meta charset="UTF-8">
    <!-- Defines the character encoding used by the webpage -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Helps the webpage display properly on different screen sizes,
         especially mobile devices -->

    <title>Document</title>
    <!-- Sets the title displayed in the browser tab -->

</head>
<!-- Closing tag of the <head> section -->

<body>
    <!-- The <body> contains the visible content of the webpage -->

</body>
<!-- Closing tag of the <body> section -->

</html>
<!-- Closing tag of the HTML document -->
